<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора (Курсовая работа)</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">← На главную</a>
        <a href="admin.html">Админка</a>
        <a href="#" id="authLink" style="margin-left: auto;">Вход</a>
    </nav>

    <div class="container admin-layout">
        <div class="sidebar">
            <button class="sidebar-btn active" onclick="switchTable('doors', this)">🚪 Двери (Door)</button>
            <button class="sidebar-btn" onclick="switchTable('variants', this)">🛠 Варианты (DoorVariant)</button>
            <button class="sidebar-btn" onclick="switchTable('orders', this)">📦 Заказы (Order)</button>
            <button class="sidebar-btn" onclick="switchTable('storage', this)">🏢 Склады (Storage)</button>
            <button class="sidebar-btn" onclick="switchTable('stores', this)">🏪 Магазины (Store)</button>
        </div>

        <div class="main-content">
            <h2 id="currentTableTitle">Управление таблицей: Двери (Door)</h2>
            
            <div class="form-container">
                <div class="form-group">
                    <input type="text" id="itemId" placeholder="ID записи (Обязательно для ИЗМЕНЕНИЯ, УДАЛЕНИЯ или ПОИСКА ПО ID)">
                    <input type="text" id="itemName" placeholder="Название двери (doorName)">
                    <input type="text" id="basePrice" placeholder="Цена базовой модели (basePrice)">
                </div>
                
                <div class="actions-row">
                    <button class="action-btn btn-post" onclick="createDoor()">Создать (POST)</button>
                    <button class="action-btn btn-put" onclick="updateDoor()">Изменить (PUT)</button>
                    <button class="action-btn btn-get-id" onclick="getOneDoor()">Вывести по ID (GET)</button>
                    <button class="action-btn btn-delete" onclick="deleteDoor()">Удалить (DELETE)</button>
                </div>
            </div>

            <h3>Вывод содержимого БД (JSON-логи):</h3>
            <div id="output">Синхронизация с сервером...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <script src="api.js"></script>
    <script>
        window.onload = () => {
            const token = localStorage.getItem('token');
            if (!token) {
                alert("Доступ запрещен! Пожалуйста, авторизуйтесь.");
                location.href = 'login.html';
                return;
            }
            checkAuth();
            switchTable('doors', document.querySelector('.sidebar-btn.active'));
        };
    </script>
</body>
</html>
